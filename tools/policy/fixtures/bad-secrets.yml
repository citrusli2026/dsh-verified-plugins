# policy-expect: R1
# A workflow referencing any secret. This repo configures zero secrets, so the
# mere presence of `secrets.*` is a violation.
name: bad-secrets
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: echo "${{ secrets.NPM_TOKEN }}" > /dev/null
