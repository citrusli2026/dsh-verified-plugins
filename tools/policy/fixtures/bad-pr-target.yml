# policy-expect: R2
# pull_request_target runs with a privileged token in the context of the base
# repository, which is how untrusted PR code gets a write token.
name: bad-pr-target
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: echo labeling
