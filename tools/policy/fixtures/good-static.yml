# policy-expect: clean
# The shape of ci.yml: static analysis only, read-only token, pinned actions,
# no plugin code executed anywhere.
name: good-static
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: echo "static checks only; no plugin is installed or executed"
