# policy-expect: R7
# Manual execution, minimal permissions — but the CI token is exported into the
# environment of the step that runs third-party code.
name: bad-exec-token
on:
  workflow_dispatch:
permissions: {}
jobs:
  verify-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm add some-dsh-plugin
