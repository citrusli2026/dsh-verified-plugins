# verify.yml — the execution tier. Maintainer-triggered only.
#
# P0: this is the only workflow that builds the verification container or runs
# anything that installs plugin code. It is reachable solely through
# `workflow_dispatch` and `schedule`, so no pull request — from a fork or
# otherwise — can cause third-party code to run here. See docs/security.md § 2.
#
# The baseline job below is V0 acceptance: it builds the container, proves the
# image is self-contained with the network fully denied, and records the fixed
# overhead of the `dsh plugin add` path.
#
# Residual risk, stated plainly: a GitHub-hosted runner has ambient credentials
# that are not repository secrets. This workflow reduces exposure — empty
# permission set, no token in the environment, no credential persistence — but
# it does not turn the runner into a security boundary.

name: verify

on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 'DSH runtime version to pin (default 0.2.0-rc.2)'
        required: false
        default: '0.2.0-rc.2'
        type: string
      verify_specs:
        description: 'Comma-separated subjects for a batch verification'
        required: false
        default: 'dsh-cost-meter@1.8.8'
        type: string
  schedule:
    # Nightly regression of the pinned sample. Catalogue freshness is checked
    # separately; this schedule does not update published reports.
    - cron: '17 3 * * *'

permissions: {}

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  container-baseline:
    name: container-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # The scrub and the execution share one step on purpose: environment
      # changes do not survive across steps, so a separate "cleanup" step would
      # be theatre. Nothing here should carry a token; drop them defensively.
      - name: Build container and record the V0 baseline
        env:
          DSH_VERSION: ${{ inputs.dsh_version }}
        run: |
          set -euo pipefail
          unset GITHUB_TOKEN GH_TOKEN ACTIONS_RUNTIME_TOKEN \
                ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL || true
          packages/runner/container/run-baseline.sh .verify/baseline

      - name: Summarise
        if: always()
        run: |
          node -e "
            const r = require('./.verify/baseline/v0-baseline.json');
            const a = r.acceptance;
            const ok = Object.values(a).every(Boolean);
            console.log('image MiB:', r.image.sizeMiB);
            console.log('cold start median ms:', r.coldStartMs.median);
            console.log('acceptance:', JSON.stringify(a));
            process.exit(ok ? 0 : 1);
          " || echo "::warning::V0 acceptance criteria not all met — see the artifact"

      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v0-baseline
          path: |
            .verify/baseline/v0-baseline.json
            .verify/baseline/cold-start-ms.txt
            .verify/baseline/offline-rc.txt
            .verify/baseline/online-rc.txt
          if-no-files-found: warn
          retention-days: 30

  # The execution dimensions end to end: static L0+L4 on the runner, then a
  # networked fetch with no subject execution, followed by L1/L2/L3/L5/L6 in
  # a network-denied container. Nothing here holds a credential.
  exec-verify:
    name: exec-verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # A batch of subjects. Each gets its own one-off container, its own
      # wall-clock ceiling, and its own report; one failure does not abort the
      # rest. Wall time per subject is emitted, so batch cost is measured
      # rather than assumed.
      - name: Build the verification container
        env:
          DSH_VERSION: ${{ inputs.dsh_version }}
        run: |
          set -euo pipefail
          docker build --build-arg "DSH_VERSION=${DSH_VERSION:-0.2.0-rc.2}" \
            -t "dsh-verifier:${DSH_VERSION:-0.2.0-rc.2}" packages/runner/container

      - name: Verify each subject
        env:
          DSH_VERSION: ${{ inputs.dsh_version }}
          VERIFY_SPECS: ${{ inputs.verify_specs }}
          # Provenance: the report records the commit that produced it. Set here
          # so a run on main cites a main commit rather than a pull-request head.
          DSH_VERIFY_COMMIT: ${{ github.sha }}
        run: |
          set -uo pipefail
          unset GITHUB_TOKEN GH_TOKEN ACTIONS_RUNTIME_TOKEN \
                ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL || true
          IMAGE="dsh-verifier:${DSH_VERSION:-0.2.0-rc.2}" \
            packages/runner/container/run-suite.sh \
            "${VERIFY_SPECS:-dsh-cost-meter@1.8.8}" .verify/reports

      - name: Report outcomes
        if: always()
        run: |
          set -uo pipefail
          echo "== per-subject cost =="
          cat .verify/reports/timings.tsv 2>/dev/null || echo "(no timings)"
          echo
          node -e "
            const fs = require('node:fs');
            const dir = '.verify/reports';
            let ok = 0, bad = 0;
            for (const slug of fs.existsSync(dir) ? fs.readdirSync(dir) : []) {
              const f = dir + '/' + slug + '/report.json';
              if (!fs.existsSync(f)) { console.log('  MISSING ' + slug); bad++; continue; }
              const r = JSON.parse(fs.readFileSync(f, 'utf8'));
              const dims = Object.entries(r.dimensions).map(([k, v]) => k.slice(0,2) + '=' + v.status).join(' ');
              console.log('  ' + r.reportId + '  ' + r.verdict + '  ' + dims);
              ok++;
            }
            console.log(ok + ' report(s) produced, ' + bad + ' missing');
          "

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exec-reports
          path: |
            .verify/reports/*/report.json
            .verify/reports/timings.tsv
          if-no-files-found: warn
          retention-days: 30
