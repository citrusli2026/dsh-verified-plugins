# verify.yml — the execution tier. Maintainer-triggered only.
#
# P0: this is the only workflow that builds the verification container or runs
# anything that installs plugin code. It is reachable solely through
# `workflow_dispatch` and `schedule`, so no pull request — from a fork or
# otherwise — can cause third-party code to run here. See docs/security.md § 2.
#
# The baseline job below is V0 acceptance: it builds the container, proves the
# image is self-contained with the network fully denied, and records the fixed
# overhead of the `dsh plugin add` path.
#
# Residual risk, stated plainly: a GitHub-hosted runner has ambient credentials
# that are not repository secrets. This workflow reduces exposure — empty
# permission set, no token in the environment, no credential persistence — but
# it does not turn the runner into a security boundary.

name: verify

on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 'DSH runtime version to pin (default 0.2.0-rc.2)'
        required: false
        default: '0.2.0-rc.2'
        type: string
      probe_spec:
        description: 'Subject for the execution reconnaissance probe'
        required: false
        default: 'dsh-find-plugin@0.4.0'
        type: string
      verify_spec:
        description: 'Subject for the full static+execution verification'
        required: false
        default: 'dsh-cost-meter@1.8.8'
        type: string
  schedule:
    # Nightly: catches a plugin that was republished underneath a published
    # report. Maintainer-controlled, so it may execute plugin code.
    - cron: '17 3 * * *'

permissions: {}

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  container-baseline:
    name: container-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # The scrub and the execution share one step on purpose: environment
      # changes do not survive across steps, so a separate "cleanup" step would
      # be theatre. Nothing here should carry a token; drop them defensively.
      - name: Build container and record the V0 baseline
        env:
          DSH_VERSION: ${{ inputs.dsh_version }}
        run: |
          set -euo pipefail
          unset GITHUB_TOKEN GH_TOKEN ACTIONS_RUNTIME_TOKEN \
                ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL || true
          packages/runner/container/run-baseline.sh .verify/baseline

      - name: Summarise
        if: always()
        run: |
          node -e "
            const r = require('./.verify/baseline/v0-baseline.json');
            const a = r.acceptance;
            const ok = Object.values(a).every(Boolean);
            console.log('image MiB:', r.image.sizeMiB);
            console.log('cold start median ms:', r.coldStartMs.median);
            console.log('acceptance:', JSON.stringify(a));
            process.exit(ok ? 0 : 1);
          " || echo "::warning::V0 acceptance criteria not all met — see the artifact"

      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v0-baseline
          path: .verify/baseline
          if-no-files-found: warn
          retention-days: 30

  # Reconnaissance for the execution dimensions. Not the verifier: it runs the
  # real CLI against a real subject and dumps what actually happens, so L1/L2/L5
  # and L6 are written against observed behaviour instead of assumptions about a
  # pre-1.0 internal boot API.
  exec-probe:
    name: exec-probe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Probe executor behaviour in a one-off container
        env:
          DSH_VERSION: ${{ inputs.dsh_version }}
          PROBE_SPEC: ${{ inputs.probe_spec }}
        run: |
          set -uo pipefail
          unset GITHUB_TOKEN GH_TOKEN ACTIONS_RUNTIME_TOKEN \
                ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL || true

          IMAGE="dsh-verifier:${DSH_VERSION:-0.2.0-rc.2}"
          SPEC="${PROBE_SPEC:-dsh-find-plugin@0.4.0}"

          docker build --build-arg "DSH_VERSION=${DSH_VERSION:-0.2.0-rc.2}" \
            -t "$IMAGE" packages/runner/container

          docker rm -f probe-run >/dev/null 2>&1 || true
          # One container, one subject, discarded afterwards. The script is
          # mounted read-only; the container never mounts the host home.
          # --entrypoint is required: the image entrypoint is `node`, so
          # without it /bin/bash is handed to node as a script path and node
          # tries to parse an ELF binary as JavaScript.
          docker run --name probe-run --entrypoint /bin/bash \
            -v "$PWD/packages/runner/container/probe.sh:/work/probe.sh:ro" \
            "$IMAGE" /work/probe.sh "$SPEC" /work/out/probe

          mkdir -p .verify/probe
          docker cp probe-run:/work/out/probe/. .verify/probe/
          docker rm -f probe-run >/dev/null 2>&1 || true

          echo "=== captured ==="
          ls -la .verify/probe

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exec-probe
          path: .verify/probe
          if-no-files-found: warn
          retention-days: 30

  # The execution dimensions end to end: static L0+L4 on the runner, L1+L2+L6
  # inside a one-off container, then the merge that produces the published
  # report. Nothing here holds a credential.
  exec-verify:
    name: exec-verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Static report (L0 + L4), on the runner
        env:
          VERIFY_SPEC: ${{ inputs.verify_spec }}
          # Provenance: the report records the commit that produced it. Set here
          # so a run on main cites a main commit rather than a pull-request head.
          DSH_VERIFY_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          node packages/cli/src/main.ts static "${VERIFY_SPEC:-dsh-cost-meter@1.8.8}" \
            --out .verify/report/static.json

      - name: Execution probe (L1 + L2 + L6), in a one-off container
        env:
          DSH_VERSION: ${{ inputs.dsh_version }}
          VERIFY_SPEC: ${{ inputs.verify_spec }}
        run: |
          set -uo pipefail
          unset GITHUB_TOKEN GH_TOKEN ACTIONS_RUNTIME_TOKEN \
                ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL || true

          IMAGE="dsh-verifier:${DSH_VERSION:-0.2.0-rc.2}"
          SPEC="${VERIFY_SPEC:-dsh-cost-meter@1.8.8}"

          docker build --build-arg "DSH_VERSION=${DSH_VERSION:-0.2.0-rc.2}" \
            -t "$IMAGE" packages/runner/container

          docker rm -f exec-run >/dev/null 2>&1 || true
          # The probe uses only Node built-ins, so it is mounted as a single
          # read-only file. No host home, no credentials, no DSH_HOME reuse.
          # The host sampler is injected into the process under test through
          # NODE_OPTIONS, so it must exist at the path the probe names.
          docker run --name exec-run --entrypoint node \
            -e "PROBE_SPEC=${SPEC}" -e "OUT_DIR=/work/out/exec" \
            -e "SAMPLER_PATH=/work/host-sampler.mjs" \
            -v "$PWD/packages/runner/src/execution-probe.ts:/work/execution-probe.ts:ro" \
            -v "$PWD/packages/runner/src/host-sampler.mjs:/work/host-sampler.mjs:ro" \
            -v "$PWD/packages/runner/fixtures:/work/fixtures:ro" \
            "$IMAGE" /work/execution-probe.ts "$SPEC"

          mkdir -p .verify/report
          docker cp exec-run:/work/out/exec/execution.json .verify/report/execution.json
          docker rm -f exec-run >/dev/null 2>&1 || true

      - name: Merge into the published report
        run: |
          set -euo pipefail
          node packages/cli/src/main.ts merge \
            .verify/report/static.json .verify/report/execution.json \
            --out .verify/report/report.json
          node packages/cli/src/main.ts validate .verify/report/report.json

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exec-report
          path: .verify/report
          if-no-files-found: warn
          retention-days: 30

  # L3 reconnaissance. The project previously concluded L3 was blocked; that
  # conclusion was tested against the version npm's `latest` tag points at,
  # which predates the pinned runtime. This probes the correctly-versioned
  # official replay plugin.
  l3-probe:
    name: l3-probe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Probe the keyless replay path in a one-off container
        env:
          DSH_VERSION: ${{ inputs.dsh_version }}
        run: |
          set -uo pipefail
          unset GITHUB_TOKEN GH_TOKEN ACTIONS_RUNTIME_TOKEN \
                ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL || true

          IMAGE="dsh-verifier:${DSH_VERSION:-0.2.0-rc.2}"
          docker build --build-arg "DSH_VERSION=${DSH_VERSION:-0.2.0-rc.2}" \
            -t "$IMAGE" packages/runner/container

          docker rm -f l3-run >/dev/null 2>&1 || true
          docker run --name l3-run --entrypoint /bin/bash \
            -v "$PWD/packages/runner/container/probe-l3.sh:/work/probe-l3.sh:ro" \
            "$IMAGE" /work/probe-l3.sh /work/out/l3

          mkdir -p .verify/l3
          docker cp l3-run:/work/out/l3/. .verify/l3/
          docker rm -f l3-run >/dev/null 2>&1 || true
          ls -la .verify/l3

      - name: Upload L3 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: l3-probe
          path: .verify/l3
          if-no-files-found: warn
          retention-days: 30

  # Attempt an actual keyless session: headless profile, the official replay
  # adapter at the version matching the pinned runtime, mounted by overlay,
  # driven by a fixture authored in this repository. No credential is used.
  l3-run:
    name: l3-run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Drive a keyless session in a one-off container
        env:
          DSH_VERSION: ${{ inputs.dsh_version }}
        run: |
          set -uo pipefail
          unset GITHUB_TOKEN GH_TOKEN ACTIONS_RUNTIME_TOKEN \
                ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL || true

          IMAGE="dsh-verifier:${DSH_VERSION:-0.2.0-rc.2}"
          docker build --build-arg "DSH_VERSION=${DSH_VERSION:-0.2.0-rc.2}" \
            -t "$IMAGE" packages/runner/container

          docker rm -f l3run >/dev/null 2>&1 || true
          docker run --name l3run --entrypoint /bin/bash \
            -v "$PWD/packages/runner/container/probe-l3-run.sh:/work/probe-l3-run.sh:ro" \
            -v "$PWD/packages/runner/fixtures:/work/fixtures:ro" \
            "$IMAGE" /work/probe-l3-run.sh /work/out/l3run

          mkdir -p .verify/l3run
          docker cp l3run:/work/out/l3run/. .verify/l3run/
          docker rm -f l3run >/dev/null 2>&1 || true
          ls -la .verify/l3run

      - name: Upload L3 run evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: l3-run
          path: .verify/l3run
          if-no-files-found: warn
          retention-days: 30
